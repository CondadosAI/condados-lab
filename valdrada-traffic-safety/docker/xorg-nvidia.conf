# Headless Xorg on an NVIDIA card (set BusID from `nvidia-smi --query-gpu=pci.bus_id`, e.g. 00000000:01:00.0 -> PCI:1:0:0): no monitor, a virtual 1920x1080 screen, GLX served by the NVIDIA module.
Section "ServerLayout"
    Identifier "L"
    Screen "S"
EndSection
Section "Device"
    Identifier "D"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "None"
EndSection
Section "Screen"
    Identifier "S"
    Device "D"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
